name: takar_khata
description: "টাকার খাতা — সম্পূর্ণ অফলাইন ব্যক্তিগত খরচ, জমা ও ধারের হিসাব।"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.5.0
  fl_chart: ^1.3.1
  intl: any
  uuid: ^4.6.0
  excel: ^4.0.6
  csv: ^8.0.0
  pdf: any
  printing: any
  archive: any
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  local_auth: ^3.0.2
  emoji_picker_flutter: ^4.5.4
  image_picker: ^1.2.4
  home_widget: ^0.10.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  path_provider_platform_interface: any
  plugin_platform_interface: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
